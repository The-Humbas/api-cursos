# ==============================================================================
# Configuracao base da API de Cursos (Aula 11 - Configuracao Externa e Actuator)
# Nenhuma credencial ou senha fica fixa neste arquivo versionado no Git.
# ==============================================================================

spring.application.name=api-cursos
server.port=${SERVER_PORT:8080}

# Credenciais e URL do PostgreSQL injetadas exclusivamente via variaveis de ambiente
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Configuracoes JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Spring Boot Actuator: expoe apenas o endpoint de saude (evitar "*" por seguranca)
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when-authorized
