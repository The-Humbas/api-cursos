# ==============================================================================
# Profile de Producao / Container (ativar com SPRING_PROFILES_ACTIVE=prod)
# Exige todas as variaveis de ambiente, desativa logs de SQL e protege detalhes do Actuator.
# ==============================================================================

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.show-sql=false

# Em producao, retorna apenas {"status":"UP"} sem expor detalhes internos da infraestrutura
management.endpoint.health.show-details=never
