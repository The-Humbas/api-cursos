# ==============================================================================
# Profile de Desenvolvimento (ativar com SPRING_PROFILES_ACTIVE=dev)
# Mantem SQL visivel no console para depuracao local e exibe detalhes do health.
# ==============================================================================

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/api_cursos}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Em ambiente local de estudo, permite visualizar o componente "db" em /actuator/health
management.endpoint.health.show-details=always
